name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON "-DINFRA_VERSION:STRING=0.1.${{ github.run_number }}"
      - name: Build plug-ins, app and tests
        run: cmake --build build --config Release --parallel --target FancyReverb_VST3 fr_tests fr_conv_tests fr_ir_tests fr_host_tests ChromosphereInfra_VST3 ChromosphereInfra_Standalone infra_tests infra_plugin_smoke infra_preset_render infra_updater_test
      - name: Tests
        run: ctest --test-dir build -C Release -R "dsp|convolver|ir_tools|engine_host|infra" --output-on-failure
      # pluginval.exe is a GUI-subsystem program: PowerShell does not wait for it on its own, so it is started with
      # -Wait and its real exit code is checked.
      - name: Fetch pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
      - name: Validate INFRA with pluginval (strictness 10)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList @('--strictness-level', '10', '--validate-in-process', '--timeout-ms', '300000', '--output-dir', 'pluginval-logs', 'build/infra/ChromosphereInfra_artefacts/Release/VST3/ChromosphereInfra.vst3')
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed for ChromosphereInfra (exit $($p.ExitCode))" }
      - name: Package reverb
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3" dist/
          Copy-Item scripts/install_windows.ps1 dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-windows-vst3
          path: dist
      - name: Package INFRA (installer + zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force infra/dist, infra/out | Out-Null
          Copy-Item -Recurse "build/infra/ChromosphereInfra_artefacts/Release/VST3/ChromosphereInfra.vst3" infra/dist/
          Copy-Item "build/infra/ChromosphereInfra_artefacts/Release/Standalone/ChromosphereInfra.exe" infra/dist/
          Copy-Item infra/scripts/install_windows.ps1 infra/dist/
          Copy-Item infra/installer/AFTER_INSTALL.txt infra/dist/README-ChromosphereInfra.txt
          Compress-Archive -Path infra/dist/* -DestinationPath infra/out/ChromosphereInfra-windows.zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=0.1.${{ github.run_number }}" infra\installer\ChromosphereInfra.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem infra/out
      - uses: actions/upload-artifact@v4
        with:
          name: ChromosphereInfra-windows
          path: infra/out
      - name: Validate the reverb with pluginval (strictness 10)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList @('--strictness-level', '10', '--validate-in-process', '--timeout-ms', '300000', '--output-dir', 'pluginval-logs-reverb', 'build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3')
          Get-ChildItem pluginval-logs-reverb -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed for FancyReverb (exit $($p.ExitCode))" }

  # macOS and Linux are not release targets yet: they run on pull requests and on demand, not on every push.
  macos:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON -DINFRA_VERSION=0.1.${{ github.run_number }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --parallel --target FancyReverb_VST3 FancyReverb_AU fr_tests fr_conv_tests fr_ir_tests ChromosphereInfra_VST3 ChromosphereInfra_AU ChromosphereInfra_Standalone infra_tests
      - name: DSP tests
        run: ctest --test-dir build -R "dsp|convolver|ir_tools|infra_dsp" --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-macos
          path: |
            build/FancyReverb_artefacts/Release/VST3
            build/FancyReverb_artefacts/Release/AU
      - name: Package INFRA
        run: |
          mkdir -p infra-out
          (cd build/infra/ChromosphereInfra_artefacts/Release && zip -qry ../../../../infra-out/ChromosphereInfra-macos.zip VST3 AU Standalone)
      - uses: actions/upload-artifact@v4
        with:
          name: ChromosphereInfra-macos
          path: infra-out

  linux:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb valgrind
      - name: Configure and build
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON -DINFRA_VERSION=0.1.${{ github.run_number }} && cmake --build build --parallel 3   # bounded: each JUCE test executable compiles the modules again
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Instruction-count regression check
        run: python3 tools/perf_check.py
      - name: INFRA editor snapshots
        run: xvfb-run -a build/infra/infra_editor_snapshot infra-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: ChromosphereInfra-linux
          path: |
            build/infra/ChromosphereInfra_artefacts/Release/VST3
            build/infra/ChromosphereInfra_artefacts/Release/Standalone
            infra-snapshots

  # Publishes the newest INFRA builds as the "infra-nightly" pre-release: one stable link for the installer, and
  # latest.json, which the updater inside INFRA reads (version, download URLs, SHA-256 of each file):
  #   https://github.com/<owner>/<repo>/releases/download/infra-nightly/ChromosphereInfra-Setup.exe
  # A separate tag from EXO's "nightly", so the two products never overwrite each other.
  release-infra:
    needs: [windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: infra-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ChromosphereInfra-windows
      - name: List
        run: find artifacts -type f
      - name: Manifest for the updater
        run: |
          W=artifacts/ChromosphereInfra-windows/ChromosphereInfra-Setup.exe
          BASE=https://github.com/${{ github.repository }}/releases/download/infra-nightly
          cat > artifacts/latest.json <<EOF
          {
            "version": "0.1.${{ github.run_number }}",
            "notes": "Automatic build of ${{ github.ref_name }} at ${{ github.sha }}",
            "downloads": {
              "windows": "$BASE/ChromosphereInfra-Setup.exe"
            },
            "sha256": {
              "windows": "$(sha256sum $W | cut -d' ' -f1)"
            }
          }
          EOF
          cat artifacts/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: infra-nightly
          target_commitish: ${{ github.sha }}
          name: Chromosphere | INFRA (nightly)
          prerelease: true
          body: |
            Latest automatic build of Chromosphere | INFRA, version 0.1.${{ github.run_number }}, from `${{ github.ref_name }}` (${{ github.sha }}).

            **Windows:** run `ChromosphereInfra-Setup.exe`. It installs the VST3 plug-in and the standalone app. Windows SmartScreen warns because the installer is not code-signed: More info > Run anyway.
            The zip holds the same files for manual installation. INFRA updates itself from this release (Updates button in the header).

          files: |
            artifacts/ChromosphereInfra-windows/ChromosphereInfra-Setup.exe
            artifacts/ChromosphereInfra-windows/ChromosphereInfra-windows.zip
            artifacts/latest.json
