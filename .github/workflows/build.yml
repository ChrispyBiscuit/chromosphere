name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON
      - name: Build plugin and DSP tests
        run: cmake --build build --config Release --parallel --target FancyReverb_VST3 fr_tests fr_conv_tests fr_ir_tests fr_host_tests
      - name: DSP tests
        run: ctest --test-dir build -C Release -R "dsp|convolver|ir_tools|engine_host" --output-on-failure
      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 120000 "build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3" dist/
          Copy-Item scripts/install_windows.ps1 dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-windows-vst3
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --parallel --target FancyReverb_VST3 FancyReverb_AU fr_tests fr_conv_tests fr_ir_tests
      - name: DSP tests
        run: ctest --test-dir build -R "dsp|convolver|ir_tools" --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-macos
          path: |
            build/FancyReverb_artefacts/Release/VST3
            build/FancyReverb_artefacts/Release/AU

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb valgrind
      - name: Configure and build
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON && cmake --build build --parallel
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Instruction-count regression check
        run: python3 tools/perf_check.py
