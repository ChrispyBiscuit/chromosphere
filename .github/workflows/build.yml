name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON
      - name: Build plugin and DSP tests
        run: cmake --build build --config Release --parallel --target FancyReverb_VST3 fr_tests fr_conv_tests fr_ir_tests fr_host_tests
      - name: DSP tests
        run: ctest --test-dir build -C Release -R "dsp|convolver|ir_tools|engine_host" --output-on-failure
      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 120000 "build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3"
      - name: Package (zip + installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, out | Out-Null
          Copy-Item -Recurse "build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3" dist/
          if (Test-Path "build/FancyReverb_artefacts/Release/AAX/FancyReverb.aaxplugin") {
            Copy-Item -Recurse "build/FancyReverb_artefacts/Release/AAX/FancyReverb.aaxplugin" dist/
          }
          Copy-Item scripts/install_windows.ps1 dist/
          Copy-Item installer/AFTER_INSTALL.txt dist/README-FancyReverb.txt
          Compress-Archive -Path dist/* -DestinationPath out/FancyReverb-windows-vst3.zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $defs = @()
          if (Test-Path dist/FancyReverb.aaxplugin) { $defs += "/DWithAAX" }
          & $iscc @defs installer\FancyReverb.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-windows
          path: out

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --parallel --target FancyReverb_VST3 FancyReverb_AU fr_tests fr_conv_tests fr_ir_tests
      - name: DSP tests
        run: ctest --test-dir build -R "dsp|convolver|ir_tools" --output-on-failure
      - name: Package
        run: |
          mkdir -p out
          (cd build/FancyReverb_artefacts/Release && zip -qry ../../../out/FancyReverb-macos.zip VST3 AU)
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-macos
          path: out

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb valgrind
      - name: Configure and build
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON && cmake --build build --parallel 3
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Instruction-count regression check
        run: python3 tools/perf_check.py

  # Publishes the newest Windows and macOS builds as a "nightly" pre-release, so there is one
  # stable link that needs no GitHub login:
  #   https://github.com/ChrispyBiscuit/FancyReverb/releases/download/nightly/FancyReverb-Setup.exe
  release:
    needs: [windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List
        run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: |
            Latest automatic build of branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Windows: run FancyReverb-Setup.exe (SmartScreen will warn because it is not code-signed: More info > Run anyway).
            The zip holds the same VST3 for manual installation.
          files: |
            artifacts/FancyReverb-windows/FancyReverb-Setup.exe
            artifacts/FancyReverb-windows/FancyReverb-windows-vst3.zip
            artifacts/FancyReverb-macos/FancyReverb-macos.zip
