name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON
      - name: Build plugin and DSP tests
        run: cmake --build build --config Release --parallel --target FancyReverb_VST3 fr_tests fr_conv_tests fr_ir_tests fr_host_tests
      - name: DSP tests
        run: ctest --test-dir build -C Release -R "dsp|convolver|ir_tools|engine_host" --output-on-failure
      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 120000 "build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/FancyReverb_artefacts/Release/VST3/FancyReverb.vst3" dist/
          Copy-Item scripts/install_windows.ps1 dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-windows-vst3
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --parallel --target FancyReverb_VST3 FancyReverb_AU fr_tests fr_conv_tests fr_ir_tests
      - name: DSP tests
        run: ctest --test-dir build -R "dsp|convolver|ir_tools" --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: FancyReverb-macos
          path: |
            build/FancyReverb_artefacts/Release/VST3
            build/FancyReverb_artefacts/Release/AU

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb valgrind
      - name: Configure and build
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON -DULTRA_VERSION=0.1.${{ github.run_number }} && cmake --build build --parallel 3   # bounded: each JUCE test executable compiles the modules again
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Instruction-count regression check
        run: python3 tools/perf_check.py
      - name: ULTRA benchmark
        run: build/ultra/ultra_bench
      - name: ULTRA editor snapshots
        run: xvfb-run -a build/ultra/ultra_editor_snapshot ultra-snapshots "Event Horizon"
      - uses: actions/upload-artifact@v4
        with:
          name: ChromosphereUltra-linux
          path: |
            build/ultra/ChromosphereUltra_artefacts/Release/VST3
            build/ultra/ChromosphereUltra_artefacts/Release/Standalone
            ultra-snapshots

  # ---- Chromosphere | ULTRA (drum machine) ----
  ultra-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON "-DULTRA_VERSION:STRING=0.1.${{ github.run_number }}"
      - name: Build plug-in, app and tests
        run: cmake --build build --config Release --parallel --target ChromosphereUltra_VST3 ChromosphereUltra_Standalone ultra_tests ultra_plugin_smoke ultra_preset_render ultra_updater_test
      - name: Tests
        run: ctest --test-dir build -C Release -R "ultra" --output-on-failure
      # pluginval.exe is a GUI-subsystem program: PowerShell does not wait for it on its own, so it is started with
      # -Wait and its real exit code is checked (as for INFRA).
      - name: Validate ULTRA with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList @('--strictness-level', '10', '--validate-in-process', '--timeout-ms', '300000', '--output-dir', 'pluginval-logs', 'build/ultra/ChromosphereUltra_artefacts/Release/VST3/ChromosphereUltra.vst3')
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed for ChromosphereUltra (exit $($p.ExitCode))" }
      - name: Package ULTRA (installer + zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ultra/dist, ultra/out | Out-Null
          Copy-Item -Recurse "build/ultra/ChromosphereUltra_artefacts/Release/VST3/ChromosphereUltra.vst3" ultra/dist/
          Copy-Item "build/ultra/ChromosphereUltra_artefacts/Release/Standalone/ChromosphereUltra.exe" ultra/dist/
          Copy-Item ultra/scripts/install_windows.ps1 ultra/dist/
          Copy-Item ultra/installer/AFTER_INSTALL.txt ultra/dist/README-ChromosphereUltra.txt
          Compress-Archive -Path ultra/dist/* -DestinationPath ultra/out/ChromosphereUltra-windows.zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=0.1.${{ github.run_number }}" ultra\installer\ChromosphereUltra.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem ultra/out
      - uses: actions/upload-artifact@v4
        with:
          name: ChromosphereUltra-windows
          path: ultra/out

  # macOS is not a release target yet: it runs on pull requests and on demand, not on every push.
  ultra-macos:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -S . -B build -DFR_BUILD_PLUGIN=ON -DULTRA_VERSION=0.1.${{ github.run_number }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --parallel --target ChromosphereUltra_VST3 ChromosphereUltra_AU ChromosphereUltra_Standalone ultra_tests
      - name: DSP tests
        run: ctest --test-dir build -R "ultra_dsp" --output-on-failure
      - name: Package
        run: |
          mkdir -p ultra-out
          (cd build/ultra/ChromosphereUltra_artefacts/Release && zip -qry ../../../../ultra-out/ChromosphereUltra-macos.zip VST3 AU Standalone)
      - uses: actions/upload-artifact@v4
        with:
          name: ChromosphereUltra-macos
          path: ultra-out

  # Publishes the newest ULTRA build as the "ultra-nightly" pre-release: one stable link for the installer, and
  # latest.json, which the updater inside ULTRA reads (version, download URL, SHA-256):
  #   https://github.com/<owner>/<repo>/releases/download/ultra-nightly/ChromosphereUltra-Setup.exe
  # A separate tag from EXO's "nightly" and INFRA's "infra-nightly", so the products never overwrite each other.
  release-ultra:
    needs: [ultra-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ultra-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ChromosphereUltra-windows
      - name: List
        run: find artifacts -type f
      - name: Manifest for the updater
        run: |
          W=artifacts/ChromosphereUltra-windows/ChromosphereUltra-Setup.exe
          BASE=https://github.com/${{ github.repository }}/releases/download/ultra-nightly
          cat > artifacts/latest.json <<EOF2
          {
            "version": "0.1.${{ github.run_number }}",
            "notes": "Automatic build of ${{ github.ref_name }} at ${{ github.sha }}",
            "downloads": {
              "windows": "$BASE/ChromosphereUltra-Setup.exe"
            },
            "sha256": {
              "windows": "$(sha256sum $W | cut -d' ' -f1)"
            }
          }
          EOF2
          cat artifacts/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultra-nightly
          target_commitish: ${{ github.sha }}
          name: Chromosphere | ULTRA (nightly)
          prerelease: true
          body: |
            Latest automatic build of Chromosphere | ULTRA, version 0.1.${{ github.run_number }}, from `${{ github.ref_name }}` (${{ github.sha }}).

            **Windows:** run `ChromosphereUltra-Setup.exe`. It installs the VST3 plug-in and the standalone app. Windows SmartScreen warns because the installer is not code-signed: More info > Run anyway.
            The zip holds the same files for manual installation. ULTRA updates itself from this release (Updates button in the header).

          files: |
            artifacts/ChromosphereUltra-windows/ChromosphereUltra-Setup.exe
            artifacts/ChromosphereUltra-windows/ChromosphereUltra-windows.zip
            artifacts/latest.json
