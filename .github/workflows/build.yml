name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCS_BUILD_PLUGIN=ON
      - name: Build plugin and DSP tests
        run: cmake --build build --config Release --parallel --target Chromosphere_VST3 cs_tests cs_conv_tests cs_ir_tests cs_host_tests
      - name: DSP tests
        run: ctest --test-dir build -C Release -R "dsp|convolver|ir_tools|engine_host" --output-on-failure
      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 120000 "build/Chromosphere_artefacts/Release/VST3/Chromosphere.vst3"
      - name: Package (zip + installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, out | Out-Null
          Copy-Item -Recurse "build/Chromosphere_artefacts/Release/VST3/Chromosphere.vst3" dist/
          if (Test-Path "build/Chromosphere_artefacts/Release/AAX/Chromosphere.aaxplugin") {
            Copy-Item -Recurse "build/Chromosphere_artefacts/Release/AAX/Chromosphere.aaxplugin" dist/
          }
          Copy-Item scripts/install_windows.ps1 dist/
          Copy-Item installer/AFTER_INSTALL.txt dist/README-Chromosphere.txt
          Compress-Archive -Path dist/* -DestinationPath out/Chromosphere-windows-vst3.zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $defs = @()
          if (Test-Path dist/Chromosphere.aaxplugin) { $defs += "/DWithAAX" }
          & $iscc @defs installer\Chromosphere.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: Chromosphere-windows
          path: out

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -S . -B build -DCS_BUILD_PLUGIN=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --parallel --target Chromosphere_VST3 Chromosphere_AU cs_tests cs_conv_tests cs_ir_tests
      - name: DSP tests
        run: ctest --test-dir build -R "dsp|convolver|ir_tools" --output-on-failure
      - name: Package
        run: |
          mkdir -p out
          (cd build/Chromosphere_artefacts/Release && zip -qry ../../../out/Chromosphere-macos.zip VST3 AU)
      - uses: actions/upload-artifact@v4
        with:
          name: Chromosphere-macos
          path: out

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb valgrind
      - name: Configure and build
        run: cmake -S . -B build -DCS_BUILD_PLUGIN=ON && cmake --build build --parallel 3
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Instruction-count regression check
        run: python3 tools/perf_check.py

  # Publishes the newest Windows and macOS builds as a "nightly" pre-release, so there is one
  # stable link that needs no GitHub login:
  #   https://github.com/ChrispyBiscuit/Chromosphere/releases/download/nightly/Chromosphere-Setup.exe
  release:
    needs: [windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List
        run: find artifacts -type f
      - name: Update manifest (read by the opt-in updater)
        run: |
          W=artifacts/Chromosphere-windows/Chromosphere-Setup.exe
          M=artifacts/Chromosphere-macos/Chromosphere-macos.zip
          cat > artifacts/latest.json <<EOF
          {
            "version": "0.1.${{ github.run_number }}",
            "notes": "Automatic build of ${{ github.ref_name }} at ${{ github.sha }}",
            "downloads": {
              "windows": "https://github.com/${{ github.repository }}/releases/download/nightly/Chromosphere-Setup.exe",
              "mac": "https://github.com/${{ github.repository }}/releases/download/nightly/Chromosphere-macos.zip"
            },
            "sha256": {
              "windows": "$(sha256sum $W | cut -d' ' -f1)",
              "mac": "$(sha256sum $M | cut -d' ' -f1)"
            }
          }
          EOF
          cat artifacts/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: |
            Latest automatic build of branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Windows: run Chromosphere-Setup.exe (SmartScreen will warn because it is not code-signed: More info > Run anyway).
            The zip holds the same VST3 for manual installation.
          files: |
            artifacts/Chromosphere-windows/Chromosphere-Setup.exe
            artifacts/Chromosphere-windows/Chromosphere-windows-vst3.zip
            artifacts/Chromosphere-macos/Chromosphere-macos.zip
            artifacts/latest.json
